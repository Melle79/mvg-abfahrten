<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVG Abfahrten</title>
<style>
  /* Anzeigetafel v2.1.0 – Cache: 2026-06-13-25 */
  :root {
    --bg: #0C141F; --panel: #131F30; --panel-2: #0F1A29;
    --ink: #EDF2F8; --muted: #7E92AB; --amber: #FFB300;
    --red: #E5443B; --line: #1E2E44; --focus: #3D7BD9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

  /* Kopf */
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  header h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  header h1 b { color: var(--ink); }
  #clock { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; color: var(--amber); }
  #clock .tick { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* Suche */
  .search { position: relative; margin-bottom: 14px; }
  .search input { width: 100%; padding: 13px 44px 13px 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; font-size: 16px; outline: none; }
  .search input:focus { border-color: var(--focus); }
  .search input::placeholder { color: var(--muted); }
  .search .spin { position: absolute; right: 14px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--amber); border-radius: 50%; animation: rot 0.8s linear infinite; display: none; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .dropdown { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.5); max-height: 320px; overflow-y: auto; display: none; }
  .dropdown button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 14px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 15px; text-align: left; cursor: pointer; }
  .dropdown button:last-child { border-bottom: 0; }
  .dropdown button:hover { background: var(--panel-2); }
  .dropdown .place { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }

  /* Tafel */
  .board { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
  .board-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .board-head h2 { font-size: 17px; font-weight: 700; }
  .board-head .sub { color: var(--muted); font-size: 13px; }

  .row { display: grid; align-items: center; grid-template-columns: minmax(58px, auto) 1fr auto auto; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; max-width: 112px; padding: 4px 7px; border-radius: 6px; font-weight: 800; font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.long { font-size: 11px; }
  .dest { min-width: 0; }
  .to { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .meta .delay { color: var(--red); font-weight: 700; }
  .meta .sev { color: var(--amber); font-weight: 700; }
  .platform { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .platform-changed { color: var(--amber); font-weight: 700; }
  .min { font-variant-numeric: tabular-nums; text-align: right; color: var(--amber); font-size: 22px; font-weight: 700; min-width: 78px; }
  .min small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .cancelled .to { text-decoration: line-through; color: var(--muted); }
  .cancelled .min { color: var(--red); }
  .info-btn { background: none; border: 0; cursor: pointer; padding: 0 3px; color: var(--red); font-size: 14px; line-height: 1; vertical-align: middle; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 14.5px; }
  .error { padding: 14px 16px; color: var(--red); font-size: 14px; }

  /* Info-Popup */
  .info-popup { position: fixed; z-index: 100; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); font-size: 13px; color: var(--ink); display: none; }
  .info-popup .info-title { font-weight: 700; margin-bottom: 6px; color: var(--amber); }
  .info-popup .info-item { margin-bottom: 5px; color: var(--muted); }
  .info-popup .info-item b { color: var(--ink); }

  @media (max-width: 520px) {
    .row { grid-template-columns: minmax(50px, auto) 1fr auto; }
    .platform { display: none; }
    .min { font-size: 19px; min-width: 64px; }
  }
  footer { margin-top: 14px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>MVG</b> Abfahrten</h1>
    <div id="clock" aria-hidden="true">--<span class="tick">:</span>--</div>
  </header>

  <div class="search">
    <input id="q" type="text" placeholder="Haltestelle suchen … (z. B. Ottobrunn)" autocomplete="off" aria-label="Haltestelle suchen">
    <div class="spin" id="spin"></div>
    <div class="dropdown" id="dropdown" role="listbox"></div>
  </div>

  <div class="board" id="board" hidden>
    <div class="board-head">
      <div>
        <h2 id="stationName"></h2>
        <div class="sub" id="stationSub"></div>
      </div>
    </div>
    <div id="rows"></div>
  </div>

  <footer>Daten: inoffizielle MVG-API · nur für private Nutzung · Aktualisierung in <span id="timer">60</span> s</footer>
</div>
<div class="info-popup" id="infoPopup"></div>

<script>
(() => {
  "use strict";

  const LINE_COLORS = {
    U1:"#438136", U2:"#C40C37", U3:"#F36E31", U4:"#0AB38D", U5:"#B8740E", U6:"#006CB3",
    S1:"#16BAE7", S2:"#76B82A", S3:"#951B81", S4:"#E30613", S5:"#005E82",
    S6:"#00975F", S7:"#943126", S8:"#262626", S20:"#ED6B83"
  };
  const LINE_GRADIENTS = {
    U7:"linear-gradient(135deg,#438136 50%,#C40C37 50%)",
    U8:"linear-gradient(135deg,#C40C37 50%,#F36E31 50%)"
  };
  const EXPRESS_GREEN = "#009A3D";
  const TYPE_COLORS = { UBAHN:"#0065B0", SBAHN:"#4C9046", TRAM:"#D82020", BUS:"#00586A", REGIONAL_BUS:"#0D5C70", BAHN:"#36397F", SEV:"#7A6A00" };
  const TYPE_SHORT  = { UBAHN:"U", SBAHN:"S", TRAM:"T", BUS:"B", REGIONAL_BUS:"B", BAHN:"R" };
  const SHORT_LABELS = { "LUFTHANSA EXPRESS BUS":"LH Bus", "Lufthansa Express Bus":"LH Bus", "ERSATZVERKEHR":"SEV" };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const qInput = $("q"), dropdown = $("dropdown"), spin = $("spin");
  const board = $("board"), rowsEl = $("rows");
  const infoPopup = $("infoPopup");

  let current = null;
  let refreshTimer = null;
  const REFRESH = 60;
  let timerEl = $("timer");
  let timerCount = REFRESH;

  function startTimer() {
    timerCount = REFRESH;
    timerEl.textContent = timerCount;
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      timerCount--;
      timerEl.textContent = timerCount;
      if (timerCount <= 0) {
        loadDepartures(false);
        timerCount = REFRESH;
      }
    }, 1000);
  }
  let debounceTimer = null;
  let searchAbort = null;
  let lastDeps = [];
  let DEFAULT_LIMIT = 10;

  // ---------- Uhr ----------
  function tickClock() {
    const d = new Date();
    $("clock").innerHTML = String(d.getHours()).padStart(2,"0") + '<span class="tick">:</span>' + String(d.getMinutes()).padStart(2,"0");
  }
  tickClock(); setInterval(tickClock, 1000);

  // ---------- Hilfen ----------
  const api = (path) => fetch("./api/" + path).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });

  function badgeHtml(label, type) {
    const shown = SHORT_LABELS[label] || label || TYPE_SHORT[type] || "?";
    let bg = LINE_GRADIENTS[label] || LINE_COLORS[label] || TYPE_COLORS[type] || "#36428D";
    if (!LINE_GRADIENTS[label] && !LINE_COLORS[label] && /^X\d+/.test(label || "")) bg = EXPRESS_GREEN;
    const fg = (label === "S8") ? "#F8C300" : "#fff";
    const cls = shown.length > 4 ? "badge long" : "badge";
    return `<span class="${cls}" style="background:${bg};color:${fg}" title="${esc(label||"")}">${esc(shown)}</span>`;
  }

  // ---------- Suche ----------
  qInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const val = qInput.value.trim();
    if (val.length < 2) { dropdown.style.display = "none"; return; }
    debounceTimer = setTimeout(() => search(val), 300);
  });

  async function search(query) {
    if (searchAbort) searchAbort.abort();
    searchAbort = new AbortController();
    spin.style.display = "block";
    try {
      const r = await fetch("./api/search?q=" + encodeURIComponent(query), { signal: searchAbort.signal });
      const list = await r.json();
      renderDropdown(Array.isArray(list) ? list : []);
    } catch (err) {
      if (err.name !== "AbortError") renderDropdown([]);
    } finally { spin.style.display = "none"; }
  }

  function renderDropdown(list) {
    dropdown.innerHTML = "";
    if (!list.length) {
      dropdown.innerHTML = '<button disabled style="color:var(--muted)">Keine Haltestelle gefunden</button>';
    } else {
      for (const st of list) {
        const b = document.createElement("button");
        b.setAttribute("role", "option");
        b.innerHTML = `<span class="types">${(st.transportTypes||[]).slice(0,4).map(t => badgeHtml(TYPE_SHORT[t]||"",t)).join("")}</span><span>${esc(st.name)}</span><span class="place">${esc(st.place||"")}</span>`;
        b.addEventListener("click", () => { dropdown.style.display = "none"; qInput.value = st.name; selectStation(st); });
        dropdown.appendChild(b);
      }
    }
    dropdown.style.display = "block";
  }

  // ---------- Station ----------
  function selectStation(st) {
    current = st;
    localStorage.setItem("mvg:last", JSON.stringify(st));
    $("stationName").textContent = st.name;
    $("stationSub").textContent = st.place || "";
    board.hidden = false;
    loadDepartures(true);
    startTimer();
  }

  async function loadDepartures(showLoading) {
    if (!current) return;
    if (showLoading) rowsEl.innerHTML = '<div class="empty">Lade Abfahrten …</div>';
    try {
      const raw = Math.min(80, Math.max(30, DEFAULT_LIMIT * 4));
      const data = await api("departures/" + encodeURIComponent(current.globalId) + "?limit=" + raw);
      lastDeps = data.departures || [];
      renderRows(lastDeps);
    } catch (err) {
      rowsEl.innerHTML = '<div class="error">MVG-API nicht erreichbar – nächster Versuch in 30 s.</div>';
    }
  }

  function renderRows(deps) {
    const visible = deps.slice(0, DEFAULT_LIMIT);
    if (!visible.length) { rowsEl.innerHTML = '<div class="empty">Keine Abfahrten.</div>'; return; }
    const now = Date.now();
    rowsEl.innerHTML = visible.map((d, i) => {
      const mins = Math.max(0, Math.round((d.realtime - now) / 60000));
      const planned = new Date(d.planned).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      const delay = d.delay > 0 ? ` <span class="delay">+${d.delay}</span>` : "";
      const sev = d.sev ? ' <span class="sev">SEV</span>' : "";
      const earlyTerm = (d.infos||[]).find(i => i.type === "EARLY_TERMINATION");
      const destHtml = earlyTerm
        ? `<span style="text-decoration:line-through;color:var(--red)">${esc(d.destination)}</span> <span style="color:var(--amber)">${esc(earlyTerm.message.replace(/^Fährt nur bis /i, ""))}</span>`
        : esc(d.destination);
      const hasInfo = (d.infos||[]).some(i => i.type !== "EARLY_TERMINATION") || (d.messages||[]).length > 0;
      const infoBadge = hasInfo ? `<button class="info-btn" data-idx="${i}">ⓘ</button>` : "";
      const occIcon = {"LOW":"🟢","MEDIUM":"🟡","HIGH":"🔴","FULL":"🔴"}[d.occupancy] || "";
      const platformTxt = d.platform != null ? (d.platformChanged ? `⚠ Gleis ${esc(d.platform)}` : `Gleis ${esc(d.platform)}`) : "";
      const minHtml = d.cancelled ? '<span class="min">entfällt</span>' : `<span class="min">${mins}<small>min</small></span>`;
      return `<div class="row${d.cancelled ? " cancelled" : ""}">
        ${badgeHtml(d.label, d.transportType)}
        <div class="dest">
          <div class="to">${destHtml}${infoBadge}</div>
          <div class="meta">${planned}${delay}${sev}${occIcon ? ' '+occIcon : ''}</div>
        </div>
        <span class="platform${d.platformChanged ? " platform-changed" : ""}">${platformTxt}</span>
        ${minHtml}
      </div>`;
    }).join("");
    // Info-Popup
    rowsEl.querySelectorAll(".info-btn").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); showInfoPopup(visible[parseInt(btn.dataset.idx)], btn); });
    });
  }

  // ---------- Info-Popup ----------
  const TYPE_LABELS = { INCIDENT:"Störung", EARLY_TERMINATION:"Vorzeitige Endstation", DISRUPTION:"Betriebsstörung", INFORMATION:"Information" };

  function showInfoPopup(dep, anchor) {
    const items = (dep.infos||[]).map(i => `<div class="info-item"><b>${esc(TYPE_LABELS[i.type]||i.type)}:</b> ${esc(i.message)}</div>`).join("");
    const msgs = (dep.messages||[]).filter(m => !(dep.infos||[]).some(i => i.message===m)).map(m => `<div class="info-item">${esc(m)}</div>`).join("");
    infoPopup.innerHTML = `<div class="info-title">${esc(dep.label)} → ${esc(dep.destination)}</div>${items}${msgs}`;
    infoPopup.style.display = "block";
    const r = anchor.getBoundingClientRect();
    let left = r.left, top = r.bottom + 6;
    if (left + 320 > window.innerWidth - 8) left = window.innerWidth - 320 - 8;
    if (top + 120 > window.innerHeight - 8) top = r.top - 120 - 6;
    infoPopup.style.left = left + "px";
    infoPopup.style.top  = top  + "px";
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".info-btn") && !e.target.closest("#infoPopup")) infoPopup.style.display = "none";
    if (!e.target.closest(".search")) dropdown.style.display = "none";
  });

  // ---------- Start ----------
  api("config").then(cfg => { if (cfg?.default_limit) DEFAULT_LIMIT = cfg.default_limit; }).catch(() => {});
  const last = localStorage.getItem("mvg:last");
  if (last) { try { const st = JSON.parse(last); qInput.value = st.name; selectStation(st); } catch {} }
})();
</script>
</body>
</html>
