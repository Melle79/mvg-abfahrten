name: MVG Abfahrten
version: "2.3.25"
slug: mvg_abfahrten
description: Abfahrtsmonitor für MVG/MVV mit Abfahrtsplänen, Dashboard-Karte und Echtzeitdaten
url: https://github.com/Melle79/mvg-abfahrten
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API & Dashboard-Karte (LAN, ohne Auth – nur im Heimnetz nutzen)
panel_icon: mdi:bus-clock
panel_title: MVG
map:
  - config:rw
homeassistant_api: true
auth_api: true
services:
  - mqtt:want
options:
  cache_ttl: 65
  default_limit: 12
  ha_ip: ""
  mqtt_enabled: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_publish_interval: 60
schema:
  cache_ttl: int(10,300)
  default_limit: int(1,80)
  ha_ip: str?
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  mqtt_publish_interval: int(20,300)
